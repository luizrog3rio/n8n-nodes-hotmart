# Points an npm dist-tag (usually "latest") at an already published version.
# Run it from the Actions tab or with:
#   gh workflow run dist-tag.yml -f version=0.1.0-beta.2 -f tag=latest
#
# Needed while the package only has prereleases: the first publish became "latest"
# and later betas only move the "beta" tag, so "latest" would stay behind.
#
# Authenticates with npm Trusted Publishing (OIDC). The trusted publisher on npm must
# list this workflow file and allow `npm dist-tag`; it is set up for publish.yml only,
# so add a second trusted publisher for dist-tag.yml before relying on this.

name: Dist-tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version, e.g. 0.1.0-beta.2
        required: true
      tag:
        description: Dist-tag to move
        required: true
        default: latest

jobs:
  dist-tag:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Move dist-tag
        run: |
          npm dist-tag add "@luizrog3rio/n8n-nodes-hotmart@${VERSION}" "$TAG"
          npm dist-tag ls @luizrog3rio/n8n-nodes-hotmart
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
